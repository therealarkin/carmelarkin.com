[build]
  publish = "."

# Redirect www to apex
[[redirects]]
  from = "https://www.carmelarkin.com/*"
  to = "https://carmelarkin.com/:splat"
  status = 301
  force = true

# Retired /bar-mitzvah/ subpage → homepage bar mitzvah section (with Evite RSVPs)
[[redirects]]
  from = "/bar-mitzvah/*"
  to = "/#barmitzvah"
  status = 301
  force = true

# Custom headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
